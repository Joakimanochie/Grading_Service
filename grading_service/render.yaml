services:
  - type: web
    name: nithub-grading-service
    runtime: python
    rootDir: grading_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false           # Set manually in Render dashboard — never in repo
      - key: SENTRY_DSN
        sync: false           # Set manually in Render dashboard
      - key: CONFIDENCE_THRESHOLD
        value: "0.65"
      - key: CHUNK_SIZE
        value: "10"
      - key: GROQ_MODEL_TEXT
        value: "meta-llama/llama-4-scout-17b-16e-instruct"
      - key: GROQ_MODEL_VISION
        value: "meta-llama/llama-4-scout-17b-16e-instruct"
      - key: ENVIRONMENT
        value: "production"
      - key: LOG_LEVEL
        value: "INFO"
